[project]
name = "data-engineering-zoomcamp-workshops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Noamane Oudnia", email = "noamaneoudnia@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "pandas>=3.1.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=26.0.0",
    "sqlalchemy>=2.1.8",
    "tqdm>=4.70.1",
]

[project.scripts]
data-engineering-zoomcamp-workshops = "data_engineering_zoomcamp_workshops:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pgcli>=4.7.1",
]
